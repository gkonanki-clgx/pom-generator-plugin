name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Maven 3.9.16
        run: |
          mkdir -p .ci-tools
          base=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          curl --fail --silent --show-error --location "$base" -o .ci-tools/maven.tar.gz
          curl --fail --silent --show-error --location "$base.sha512" -o .ci-tools/maven.tar.gz.sha512
          echo "$(cat .ci-tools/maven.tar.gz.sha512)  .ci-tools/maven.tar.gz" | sha512sum --check
          tar -xzf .ci-tools/maven.tar.gz -C .ci-tools
          maven_bin="$PWD/.ci-tools/apache-maven-3.9.16/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # GITHUB_PATH entries must be native Windows paths; Git Bash then resolves the bundled mvn script.
            maven_bin="$(cygpath --windows "$maven_bin")"
          fi
          echo "$maven_bin" >> "$GITHUB_PATH"
      - name: Verify runtime and synthetic integration tests
        run: |
          java -version
          mvn -version
          mvn --batch-mode --no-transfer-progress clean verify
